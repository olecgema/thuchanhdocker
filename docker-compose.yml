services:
  react-app:
    build:
      context: .
      # Chế độ này dùng để lập trình (Development)
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Giúp nhận diện thay đổi file trên Windows tốt hơn
    command: npm run dev -- --host